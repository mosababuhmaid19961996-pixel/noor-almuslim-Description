<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول المسؤول | نور المسلم</title><link rel="stylesheet" href="/style.css"><style>main{max-width:520px;margin:70px auto;padding:20px}.box{background:#fff;padding:28px;border-radius:24px;box-shadow:0 15px 40px #102b4318}input,button{width:100%;padding:14px;border-radius:14px;border:1px solid #d6e0e7;font:inherit;margin-top:10px}button{background:#147a5a;color:white;font-weight:700;cursor:pointer}.err{color:#b42318;margin-top:12px}</style></head><body><main><div class="box"><h1>🔐 لوحة مسؤول نور المسلم</h1><p>هذه الصفحة خاصة بمسؤول الموقع.</p><form id="f"><input id="p" type="password" placeholder="كلمة مرور المسؤول" required><button>دخول</button></form><div id="e" class="err"></div></div></main><script>f.onsubmit=async e=>{e.preventDefault();e=document.getElementById('e');e.textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:p.value})});const d=await r.json();if(r.ok)location.href='/admin/';else e.textContent=d.error||'تعذر الدخول';}</script></body></html>
