<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b43"><title>الدردشة مع مسؤول المجموعة | نور المسلم</title><link rel="stylesheet" href="style.css"><style>.chat-wrap{max-width:760px;margin:35px auto;padding:0 16px}.chat-card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 12px 35px rgba(16,43,67,.12)}.chat-header{display:flex;gap:14px;align-items:center;margin-bottom:18px}.chat-avatar{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#e7f7f0;font-size:28px}.chat-messages{min-height:260px;max-height:480px;overflow:auto;background:#f5f8fa;border-radius:18px;padding:16px;margin-bottom:14px}.msg{background:#fff;border-radius:16px;padding:11px 14px;margin:8px 0;max-width:85%;box-shadow:0 3px 10px rgba(0,0,0,.05)}.msg.admin{margin-left:auto;background:#e9f8f1}.chat-form{display:grid;gap:10px}.chat-form input,.chat-form textarea{border:1px solid #d7e0e7;border-radius:14px;padding:12px;font:inherit}.chat-form textarea{min-height:110px;resize:vertical}.admin-chat-btn{display:inline-block;background:#147a5a;color:#fff;border:0;text-decoration:none;padding:12px 18px;border-radius:14px;font-weight:700;font:inherit;cursor:pointer}.notice{font-size:13px;color:#667784;margin-top:10px}</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">🌿</span><div><strong>نور المسلم</strong><small>القرآن والأذكار والأدعية وأكثر</small></div></a><nav id="nav"><a href="index.html">الرئيسية</a><a href="sections.html">الأقسام</a><a href="about.html">حول الموقع</a></nav><div class="actions"><button id="menuToggle" aria-label="القائمة">☰</button></div></header><main class="chat-wrap"><div class="chat-card"><div class="chat-header"><div class="chat-avatar">💬</div><div><h1 style="margin:0">الدردشة مع مسؤول المجموعة</h1><p style="margin:5px 0 0;color:#667784">اقتراحاتك وأفكارك تساعدنا على تطوير نور المسلم</p></div></div><div class="chat-messages" id="messages"><div class="msg">السلام عليكم 🌿 اكتب اقتراحك أو رسالتك هنا.</div></div><form class="chat-form" id="chatForm"><input id="name" maxlength="120" placeholder="اسمك (اختياري)"><textarea id="message" maxlength="4000" required placeholder="اكتب اقتراحك أو رسالتك..."></textarea><button class="admin-chat-btn" type="submit">إرسال الرسالة</button></form><p class="notice" id="status">رسالتك تصل إلى لوحة مسؤول نور المسلم.</p></div></main><script>const form=document.getElementById('chatForm'),box=document.getElementById('messages'),status=document.getElementById('status');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const r=await fetch('/api/messages');if(!r.ok)return;const d=await r.json();box.innerHTML='';(d.messages||[]).forEach(x=>{const el=document.createElement('div');el.className='msg '+(x.role==='admin'?'admin':'');el.innerHTML='<b>'+esc(x.name||'مسؤول المجموعة')+'</b><div>'+esc(x.body)+'</div>';box.appendChild(el)});box.scrollTop=box.scrollHeight}form.onsubmit=async e=>{e.preventDefault();const message=document.getElementById('message').value.trim();if(!message)return;status.textContent='جارٍ إرسال الرسالة…';const r=await fetch('/api/suggestions',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value.trim(),message})});if(r.ok){document.getElementById('message').value='';status.textContent='تم إرسال رسالتك إلى المسؤول ✅';load()}else{const d=await r.json().catch(()=>({}));status.textContent=d.error||'تعذر إرسال الرسالة.'}};load();setInterval(load,10000)</script></body></html>
