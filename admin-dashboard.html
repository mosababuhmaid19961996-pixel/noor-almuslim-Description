<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المسؤول | نور المسلم</title><link rel="stylesheet" href="/style.css"><style>main{max-width:1000px;margin:30px auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.chat{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 30px #102b4312}.stat b{display:block;font-size:30px;margin-top:8px}.chat{margin-top:18px}.msg{padding:14px;border-radius:16px;background:#f5f8fa;margin:10px 0}.msg.admin{background:#e8f7ef}.reply{display:flex;gap:8px;margin-top:8px}.reply input{flex:1;padding:11px;border:1px solid #d6e0e7;border-radius:12px;font:inherit}.reply button,.logout{border:0;border-radius:12px;padding:11px 15px;background:#147a5a;color:#fff;font:inherit;font-weight:700}.logout{background:#7b2d2d}.meta{font-size:12px;color:#70808b}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.top h1{font-size:22px}}</style></head><body><main><div class="top"><div><h1>🔐 لوحة مسؤول نور المسلم</h1><p>الإحصاءات والاقتراحات الخاصة بالمسؤول.</p></div><button class="logout" id="logout">تسجيل الخروج</button></div><section class="stats"><div class="stat">👥 إجمالي الزوار<b id="total">—</b></div><div class="stat">📅 زوار اليوم<b id="today">—</b></div><div class="stat">🗓️ زوار الشهر<b id="month">—</b></div><div class="stat">📄 مشاهدات الصفحات<b id="views">—</b></div></section><section class="chat"><h2>💬 اقتراحات ورسائل الزوار</h2><div id="messages">جاري التحميل…</div></section></main><script>async function load(){let r=await fetch('/api/admin/stats');if(r.status===401){location.href='/admin/';return}let s=await r.json();total.textContent=s.totalVisitors;today.textContent=s.todayVisitors;month.textContent=s.monthVisitors;views.textContent=s.pageViews;let m=await fetch('/api/admin/messages');let d=await m.json();messages.innerHTML='';(d.messages||[]).forEach(x=>{let el=document.createElement('div');el.className='msg '+(x.role==='admin'?'admin':'');el.innerHTML='<b>'+esc(x.name||x.role)+'</b><div>'+esc(x.body)+'</div><div class="meta">'+new Date(x.created_at).toLocaleString('ar')+'</div>';if(x.role==='visitor'){let form=document.createElement('div');form.className='reply';form.innerHTML='<input placeholder="اكتب الرد..."><button>إرسال</button>';form.querySelector('button').onclick=async()=>{let v=form.querySelector('input').value.trim();if(!v)return;await fetch('/api/admin/reply',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({visitor_id:x.visitor_id,message:v})});load()};el.appendChild(form)}messages.appendChild(el)})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}logout.onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/admin/'}load();setInterval(load,15000)</script></body></html>
